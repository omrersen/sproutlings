<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sproutlings • Online Çiftlik</title>
<style>
:root{color-scheme:dark;--bg:#122720;--panel:#203d32;--border:#416753;--gold:#f2d38b;--text:#f0f4ea;--sub:#b7c9ba;--green:#8fd5a2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 0,#335848,#122720 55%);color:var(--text);font:15px system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#142b24ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:16px max(20px,calc((100vw - 1200px)/2));display:flex;gap:14px;align-items:center;flex-wrap:wrap}h1{font-size:24px;letter-spacing:1px;margin:0;color:var(--gold)}h2{font-size:23px;margin:0 0 16px}h3{font-size:17px;margin:0 0 10px;color:var(--gold)}main{max-width:1200px;margin:auto;padding:24px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}button,input,select{font:inherit;border-radius:9px;border:1px solid var(--border);padding:10px 12px;background:#142b24;color:var(--text)}button{cursor:pointer;font-weight:600}button:hover,button:focus-visible{border-color:var(--green);background:#315442}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#8fd5a2;color:#13271f;border:0}.card{border:1px solid var(--border);background:var(--panel);border-radius:15px;padding:16px;min-width:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}.farm{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{background:linear-gradient(140deg,#8b6549,#573e2b);border:1px solid #ba9b65;border-radius:14px;min-height:120px;padding:12px;display:flex;flex-direction:column;justify-content:space-between}.tile.ready{background:linear-gradient(140deg,#456e3d,#2c5535);border-color:#9ed67a}.tile strong{font-size:18px}.sub{color:var(--sub);font-size:13px}.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:9px 0}.spacer{flex:1}.metric{color:var(--gold);font-size:19px;font-weight:650}.hidden{display:none!important}#msg{min-height:24px;color:var(--gold);margin-bottom:12px}#login{max-width:440px;margin:60px auto}input{max-width:100%}.scroll{overflow:auto}table{border-collapse:collapse;width:100%}td,th{padding:10px;text-align:left;border-bottom:1px solid var(--border)}svg{width:100%;height:auto}.progress{height:8px;background:#142b24;border-radius:8px;overflow:hidden}.progress span{height:100%;display:block;background:var(--green)}.pet{border-top:3px solid var(--r)}.tag{font-size:12px;color:var(--sub)}.warning{color:#f5b79f}.field{display:grid;gap:6px;margin:10px 0}.active{border-color:var(--green);color:var(--green)}@media(max-width:650px){main{padding:14px}.farm{grid-template-columns:repeat(2,1fr)}header{position:static}.grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:no-preference){.tile,.card{animation:appear .25s ease-out}@keyframes appear{from{opacity:.7;transform:translateY(3px)}to{opacity:1;transform:none}}}
</style></head><body><header><h1>SPROUTLINGS</h1><span class="sub">V1.0 • ÇEVRİM İÇİ ÇİFTLİK</span><span class="spacer"></span><span id="stats"></span><button id="logout" class="hidden">Çıkış</button></header>
<main><div id="msg" role="status" aria-live="polite"></div><section id="login" class="card"><h2>Vadide yeni bir başlangıç</h2><p class="sub">Çevrim içi kayıt, 3D yerel çiftlikten bağımsızdır. Sunucu altın, ürün ve yaratıkların sahibi olan hesapları doğrular.</p><label class="field">Kullanıcı adı<input id="name" autocomplete="username" maxlength="20"></label><label class="field">Şifre<input id="password" type="password" autocomplete="current-password" minlength="10"></label><div class="line"><button class="primary" id="loginBtn">Giriş yap</button><button id="registerBtn">Hesap oluştur</button></div></section>
<section id="app" class="hidden"><nav id="nav"></nav><div id="content"></div></section></main>
<script>
"use strict";
const $=id=>document.getElementById(id),S=["Filizburun","Pofmantar","Damlaç","Yaprakuyruk","Kıvılkın","Kristip","Gecekanat","Gökboynuz","Solvaris","Lunareth","Aetherion","Verdalux"],R=["Common","Uncommon","Rare","Epic","Legendary","Mythic"],RC=["#b9c7ad","#70ce88","#6cb8f4","#bd88ef","#ffcb65","#f9a5e2"],C=["Buğday","Havuç","Mısır","Orman meyvesi","Ejder biberi","Kristal meyve","Ay balı"],F=["Tahıl","Meyve yemi","Baharatlı yem","Kristal karışım","Göksel ziyafet","Yıldız nektarı"],I=[...C,...F],T=["Ahşap","Demir","Altın","Kristal","Efsanevi","Etkinlik"],O=[[70,25,5,0,0,0],[45,35,17,3,0,0],[20,35,33,11,1,0],[5,20,40,29,6,0],[0,5,30,50,15,0],[15,30,35,15,4.5,.5]],PR=[10,7,5,3,2,3],PL=[0,0,20,12,8,20],LV=[1,2,4,5,8,12,16],TC=[1,5,12,25,40,5],COST=[2,3,5,8,14,22,20],FEED=[8,15,32,55,95,115];
let token=sessionStorage.getItem("sprout_token")||"",state=null,tab="farm",busy=false,selectedCrop=0,keep=false,offset=0,market=[],trades=[],leaders=[],visitor=null,chart=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),fmt=n=>Number(n).toLocaleString("tr-TR"),now=()=>Date.now()/1000+offset;
function msg(s,err=false){$("msg").textContent=s;$("msg").classList.toggle("warning",err)}
async function api(action,data={},mutate=false){const body={action,...data};if(mutate)body.nonce=crypto.randomUUID();let r=await fetch("/api",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(body)});let j=await r.json();if(!j.ok)throw Error(j.error);return j.data}
async function auth(a){if(busy)return;busy=true;try{let x=await api(a,{name:$("name").value,password:$("password").value});token=x.token;sessionStorage.setItem("sprout_token",token);$("password").value="";await reload();msg("Hoş geldin, "+x.name+"!")}catch(e){msg(e.message,true)}finally{busy=false}}
function showLogin(){token="";sessionStorage.removeItem("sprout_token");$("login").classList.remove("hidden");$("app").classList.add("hidden");$("logout").classList.add("hidden");$("stats").textContent=""}
async function reload(){state=await api("state");offset=state.now-Date.now()/1000;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("logout").classList.remove("hidden");$("stats").textContent=state.user.name+" • L"+state.user.level+" • "+fmt(state.user.gold)+" G";if(tab==="market")market=await api("market");if(tab==="trade")trades=await api("trades");if(tab==="social")leaders=await api("leaderboard");render()}
async function act(a,d={}){if(busy)return;busy=true;try{let x=await api(a,d,true);msg(x.message||"Başarılı");await reload()}catch(e){msg(e.message,true);try{await reload()}catch(_){}}finally{busy=false}}
function button(label,a,attrs="",disabled=false){return '<button data-act="'+a+'" '+attrs+(disabled?' disabled':'')+'>'+esc(label)+'</button>'}
function select(id,opts,chosen=0){return '<select id="'+id+'">'+opts.map((x,i)=>'<option value="'+i+'" '+(i===chosen?'selected':'')+'>'+esc(x)+'</option>').join("")+'</select>'}
function title(t,sub){return '<h2>'+esc(t)+'</h2><p class="sub">'+esc(sub)+'</p>'}
function render(){if(!state)return;let u=state.user;
$("nav").innerHTML=[["farm","Çiftlik"],["pets","Yaratıklar"],["inventory","Envanter"],["market","Pazar"],["trade","Takas"],["quests","Görevler"],["social","Çiftlikler"]].map(([id,label])=>'<button data-tab="'+id+'" class="'+(tab===id?"active":"")+'">'+label+'</button>').join("")+button("Yenile","refresh");
let h="";
if(tab==="farm"){
h=title("Çevrim içi çiftliğin","Ekim → sulama → hasat. Süreler ve ödüller sunucuda doğrulanır.")+'<div class="line">'+select("crop",C.map((x,i)=>x+" • "+COST[i]+" G"+(u.level<LV[i]?" (L"+LV[i]+")":"")),selectedCrop)+'<label><input type="checkbox" id="keep" '+(keep?"checked":"")+'> Hasadı depola</label>'+button("4 tarla aç","expand","",u.land>=12)+'</div><div class="farm">'+state.plots.map(p=>{
let planted=p.crop>=0,watered=p.ready>0,ready=watered&&p.ready<=now();return '<div class="tile '+(ready?"ready":"")+'"><span class="sub">TARLA '+(p.slot+1)+'</span><strong>'+esc(planted?C[p.crop]:"Boş tarla")+'</strong>'+(planted&&watered&&!ready?'<span class="timer" data-ready="'+p.ready+'"></span>':'')+button(!planted?"Ek":!watered?"Sula":ready?"Hasat":"Büyüyor",!planted?"plant":!watered?"water":"harvest",'data-slot="'+p.slot+'"',planted&&watered&&!ready)+'</div>'}).join("")+'</div><div class="line"><span class="metric">XP '+u.xp+' / '+(100+30*(u.level-1))+'</span><span class="sub">Toplam hasat '+u.harvests+'</span></div>';
}else if(tab==="pets"){
h=title("Kuluçka merkezi","Kasalar görev ve seviye ile kazanılır. Satın alınabilir rastgele kasa yok.")+'<div class="grid">'+state.crates.map(q=>{
let t=q.tier,low=t===5&&q.m>=39?5:PL[t]&&q.l>=PL[t]-1?4:q.r>=PR[t]-1?2:0,w=O[t].map((v,i)=>i>=low?v:0),total=w.reduce((a,b)=>a+b,0);return '<div class="card"><h3>'+T[t]+' ×'+q.qty+'</h3><p class="sub">'+w.map((v,i)=>v?R[i]+" %"+(100*v/total).toFixed(1):"").filter(Boolean).join(" · ")+'</p><p>Rare+ '+q.r+'/'+PR[t]+(PL[t]?' • L '+q.l+'/'+PL[t]:'')+(t===5?' • M '+q.m+'/40':'')+'</p>'+button("Kasayı aç","open",'data-tier="'+t+'"',!q.qty||u.level<TC[t])+'</div>'}).join("")+'</div><h2 style="margin-top:24px">Koleksiyon • '+state.pets.length+'</h2><div class="grid">'+state.pets.map(p=>'<article class="card pet" style="--r:'+RC[Math.floor(p.species/2)]+'"><h3>'+S[p.species]+(p.shiny?' ★':'')+'</h3><span class="tag">'+R[Math.floor(p.species/2)]+' · #'+p.id+'</span><p>'+ (p.lock?"Emanette":p.active?"Aktif":"Koleksiyonda")+' · '+(p.fed>now()?"Tok":"Aç")+' · XP '+p.growth+'</p>'+button("Besle ("+FEED[Math.floor(p.species/2)]+" G / yem)","feed",'data-pet="'+p.id+'"',!!p.lock||p.fed>now())+' '+button(p.active?"Görevden al":"Görevlendir","activate",'data-pet="'+p.id+'"',!!p.lock)+'</article>').join("")+'</div>';
}else if(tab==="inventory"){
h=title("Depo ve yem atölyesi","Çiftliğinde biriktirdiğin malzemeler ve üretilen yemler.")+'<div class="grid">'+I.map((x,i)=>'<div class="card"><h3>'+esc(x)+'</h3><div class="metric">'+state.stock[i]+' adet</div>'+(i<7?button("1 sat","npc_sell",'data-item="'+i+'"',!state.stock[i]):button("Üret","craft",'data-rarity="'+(i-7)+'"',u.level<3))+'</div>').join("")+'</div><p class="sub">Yem tarifleri: buğday; havuç; mısır+havuç; ejder biberi; kristal meyve; ay balı+kristal meyve. Üretim ücreti 1/2/2/3/5/8 G.</p>';
}else if(tab==="market"){
h=title("Oyuncu pazarı","L5 • %5 işlem vergisi (en az 1 G) • 48 saat ilan • en fazla 5 aktif ilan.")+'<div class="grid"><div class="card"><h3>Yaratık ilanı</h3><select id="petListing">'+state.pets.filter(p=>!p.active&&!p.lock).map(p=>'<option value="'+p.id+'">'+S[p.species]+' #'+p.id+'</option>').join("")+'</select><label class="field">Toplam fiyat<input type="number" id="petPrice" min="1" value="100"></label>'+button("İlan ver","listpet","",u.level<5)+'</div><div class="card"><h3>Malzeme / yem ilanı</h3>'+select("itemListing",I)+'<div class="line"><input aria-label="Adet" type="number" id="itemQty" min="1" value="1" style="width:90px"><input aria-label="Toplam fiyat" type="number" id="itemPrice" min="1" value="10" style="width:110px"></div>'+button("İlan ver","listitem","",u.level<5)+'</div><div class="card"><h3>Fiyat geçmişi</h3><select id="historyKind"><option value="pet">Yaratık</option><option value="item">Malzeme</option></select><div id="historyAsset">'+select("histAsset",S)+'</div><select id="days"><option value="7">7 gün</option><option value="30">30 gün</option></select> '+button("Grafik","history")+'</div></div><div id="chart" class="card hidden" style="margin-top:14px"></div><h2 style="margin-top:24px">Açık ilanlar</h2><div class="grid">'+market.map(l=>'<div class="card"><h3>'+esc(l.kind==="pet"?S[l.species]+(l.shiny?" ★":""):I[l.asset])+'</h3><p>'+esc(l.seller_name)+' · '+l.qty+' adet · <strong>'+fmt(l.price)+' G</strong></p>'+button(l.seller===u.id?"İptal":"Satın al",l.seller===u.id?"cancel_listing":"buy",'data-listing="'+l.id+'"',l.seller!==u.id&&u.level<5)+'</div>').join("")+'</div>'+(market.length?"":"<p>Henüz açık ilan yok.</p>");
}else if(tab==="trade"){
h=title("Güvenli takas","Gönderdiğin yaratık emanet hesabına alınır. Teklif değiştirilemez. İki tarafın onayıyla atomik takas.")+'<div class="card"><h3>Yeni teklif</h3><p class="sub">Hedef oyuncu ve istediğin yaratık kimliğini Çiftlikler bölümünde görebilirsin.</p><label class="field">Hedef oyuncu ID<input id="target" type="number" min="1" value="'+(visitor?visitor.user.id:"")+'"></label><label class="field">Vereceğin yaratık<select id="give">'+state.pets.filter(p=>!p.active&&!p.lock).map(p=>'<option value="'+p.id+'">'+S[p.species]+' #'+p.id+'</option>').join("")+'</select></label><label class="field">İstediğin yaratık ID<input id="ask" type="number" min="1"></label>'+button("Onayla ve teklif gönder","offer","",u.level<5)+'</div><div class="grid" style="margin-top:12px">'+trades.map(t=>'<div class="card"><h3>#'+t.id+' • '+esc(t.maker_name)+' → '+esc(t.target_name)+'</h3><p>'+S[t.give_species]+(t.give_shiny?" ★":"")+' #'+t.give+' ↔ '+S[t.ask_species]+(t.ask_shiny?" ★":"")+' #'+t.ask+'</p>'+ (t.target===u.id?button("Son onay","accept",'data-trade="'+t.id+'"'):"")+' '+button("İptal","cancel_trade",'data-trade="'+t.id+'"')+'</div>').join("")+'</div>';
}else if(tab==="quests"){
h=title("Görevler ve hasat festivali","Günlük ve haftalık dönemler UTC üzerinden sıfırlanır. Festival L5'te etkinlik kasası verir.")+'<div class="grid">'+state.quests.map(q=>'<div class="card"><h3>'+esc(q.title)+'</h3><p>'+q.count+'/'+q.goal+' · '+q.reward+' G + '+T[q.tier]+'</p><div class="progress"><span style="width:'+Math.min(100,q.count/q.goal*100)+'%"></span></div><p>'+button(q.claimed?"Alındı":"Ödülü al","claim",'data-key="'+esc(q.key)+'"',q.claimed||q.count<q.goal||u.level<TC[q.tier])+'</p></div>').join("")+'</div>';
}else{
h=title("Vadideki çiftlikler","Liderlik tablosu • oyuncunun herkese açık çiftliğini ziyaret et.")+'<div class="card scroll"><table><thead><tr><th>Sıra</th><th>Oyuncu</th><th>Seviye</th><th>Hasat</th><th></th></tr></thead><tbody>'+leaders.map((v,i)=>'<tr><td>'+ (i+1)+'</td><td>'+esc(v.name)+' #'+v.id+'</td><td>'+v.level+'</td><td>'+v.harvests+'</td><td>'+button("Ziyaret","visit",'data-user="'+v.id+'"')+'</td></tr>').join("")+'</tbody></table></div><div id="visitor"></div>';
}
$("content").innerHTML=h;if(tab==="social"&&visitor)drawVisitor();if(tab==="market"&&chart)drawChart();tick();
}
function drawVisitor(){let v=visitor;if(!v||!$("visitor"))return;$("visitor").innerHTML='<div class="card" style="margin-top:16px"><h3>'+esc(v.user.name)+' • #'+v.user.id+'</h3><p>L'+v.user.level+' · '+v.user.land+' tarla</p><div class="farm">'+v.plots.map(p=>'<div class="tile"><span>Tarla '+(p.slot+1)+'</span><strong>'+esc(p.crop<0?"Boş":C[p.crop])+'</strong></div>').join("")+'</div><h3 style="margin-top:15px">Yaratıklar</h3>'+v.pets.map(p=>'<p>'+S[p.species]+(p.shiny?" ★":"")+' • #'+p.id+(p.lock?" • Emanette":p.active?" • Aktif":"")+'</p>').join("")+'</div>'}
function drawChart(){let el=$("chart");if(!el||!chart)return;let d=chart.data;el.classList.remove("hidden");let vals=d.sales.map(s=>s.price/s.qty),max=Math.max(1,...vals),pts=vals.map((v,i)=>(25+(i/Math.max(1,vals.length-1))*450)+","+(160-v/max*135)).join(" ");el.innerHTML='<h3>'+esc(chart.name)+'</h3><p>'+d.count+' işlem · '+(d.count<5?"Yetersiz veri; istatistik temsilî olabilir.":"Ortalama "+fmt(d.average)+" G · Medyan "+fmt(d.median)+" G")+'</p>'+(vals.length?'<svg viewBox="0 0 500 185" role="img" aria-label="Tamamlanan satışların birim fiyatları"><path d="M25 15V160H475" stroke="#789682" fill="none"/><polyline points="'+pts+'" fill="none" stroke="#f2d38b" stroke-width="3"/>'+vals.map((v,i)=>'<circle cx="'+(25+i/Math.max(1,vals.length-1)*450)+'" cy="'+(160-v/max*135)+'" r="3" fill="#8fd5a2"/>').join("")+'<text x="28" y="13" fill="#ddd" font-size="12">'+fmt(max)+' G</text></svg>':'<p>Henüz tamamlanmış satış yok.</p>')}
function tick(){document.querySelectorAll(".timer").forEach(el=>{let remain=Math.ceil(Number(el.dataset.ready)-now());el.textContent=remain>0?remain+" sn":"Hazır • Yenile";if(remain<=0){let b=el.parentElement.querySelector("button");b.disabled=false;b.textContent="Hasat";b.dataset.act="harvest"}})}
setInterval(tick,500);
$("loginBtn").onclick=()=>auth("login");$("registerBtn").onclick=()=>auth("register");$("logout").onclick=async()=>{try{await api("logout")}catch(_){}showLogin()};
document.addEventListener("change",e=>{if(e.target.id==="crop")selectedCrop=+e.target.value;if(e.target.id==="keep")keep=e.target.checked;if(e.target.id==="historyKind")$("historyAsset").innerHTML=select("histAsset",e.target.value==="pet"?S:I)});
document.addEventListener("click",async e=>{let b=e.target.closest("button");if(!b||busy)return;if(b.dataset.tab){tab=b.dataset.tab;visitor=tab==="social"?visitor:null;chart=null;try{await reload()}catch(e){msg(e.message,true)}return}let a=b.dataset.act;if(!a)return;let d={},n=id=>Number($(id).value);for(let key of ["slot","tier","pet","item","rarity","listing","trade","user"])if(key in b.dataset)d[key]=+b.dataset[key];if(b.dataset.key)d.key=b.dataset.key;
if(a==="refresh"){try{await reload()}catch(e){msg(e.message,true)}return}
if(a==="plant")d.crop=selectedCrop;if(a==="harvest")d.keep=keep;if(a==="npc_sell")d.qty=1;
if(a==="listpet"){a="list";d={kind:"pet",asset:n("petListing"),price:n("petPrice")}}
if(a==="listitem"){a="list";d={kind:"item",asset:n("itemListing"),price:n("itemPrice"),qty:n("itemQty")}}
if(a==="offer"){d={target:n("target"),give:n("give"),ask:n("ask")};if(!confirm("Bu sabit teklifi gönder ve yaratığını emanete al?"))return}
if(a==="accept"&&!confirm("Gösterilen iki yaratığı kesin olarak takas et?"))return;
if(a==="buy"&&!confirm("İlanın gösterilen fiyatını ödemeyi onaylıyor musun?"))return;
if(a==="visit"){try{visitor=await api("visit",d);drawVisitor()}catch(e){msg(e.message,true)}return}
if(a==="history"){try{let kind=$("historyKind").value,asset=n("histAsset");chart={name:(kind==="pet"?S:I)[asset],data:await api("history",{kind,asset,days:n("days")})};drawChart()}catch(e){msg(e.message,true)}return}
await act(a,d)});
if(token)reload().catch(()=>showLogin());
</script></body></html>
