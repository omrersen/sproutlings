name: Desktop game tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fL --retry 3 https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Run desktop tests
        run: |
          set -o pipefail
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path . --quit-after 300 -- --self-test | tee /tmp/test.log
          grep -q 'V1.2 PASS' /tmp/test.log
          grep -q 'V1 PASS' /tmp/test.log
          grep -q 'SPROUTLINGS SELF-TEST PASS' /tmp/test.log
