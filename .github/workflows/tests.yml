name: Server integration tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test_online.py
      - run: node -e "const s=require('fs').readFileSync('online.html','utf8'); new Function(s.split('<script>')[1].split('</script>')[0])"
